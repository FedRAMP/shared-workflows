# Fixed harness: dispatched at the release candidate, never generated at runtime.
name: "(Local) Test: Internal Pipeline Phase"
run-name: "(Local) Test: Internal Pipeline Phase — ${{ inputs.phase == 'create' && 'Build Sites And Create PR' || inputs.phase == 'refresh' && 'Rebuild And Update PR' || 'Verify Unchanged Sources Skip Builds' }} — parent #${{ inputs.parent-run }}"
on:
  workflow_dispatch:
    inputs:
      parent-run:
        description: Controller run ID for navigation
        type: string
        required: true
      phase:
        type: choice
        options: [create, refresh, skip]
        required: true
      sites:
        description: Production site definitions with pinned source SHAs
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    name: Validate Test Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.inputs.outputs.sites }}
      matrix: ${{ steps.inputs.outputs.matrix }}
      base: ${{ steps.inputs.outputs.base }}
      branch: ${{ steps.inputs.outputs.branch }}
    steps:
      - name: Checkout Repository Sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate Test Inputs
        id: inputs
        env:
          SITES: ${{ inputs.sites }}
        run: python3 release-management/release.py harness

  import:
    name: Test Import Lifecycle
    needs: prepare
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/import-zensical-sites.yml
    with:
      sites: ${{ needs.prepare.outputs.sites }}
      create-pr: true
      release-test: true
      base-branch: ${{ needs.prepare.outputs.base }}
      import-branch: ${{ needs.prepare.outputs.branch }}

  preview:
    name: Preview ${{ matrix.id }} Site
    needs: prepare
    if: inputs.phase == 'create'
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-fr-zensical.yml
    with:
      deploy: false
      source-repository: ${{ matrix.repository }}
      source-ref: ${{ matrix.sha }}
      artifact-name: preview-${{ matrix.id }}
      artifact-mode: pages
      preview-urls: true
      use-bun: ${{ matrix.use-bun }}
      submodules: ${{ matrix.submodules }}
      venv-path: ${{ matrix.venv-path }}
      build-script: ${{ matrix.build-script }}
