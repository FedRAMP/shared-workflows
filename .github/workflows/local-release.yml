name: "(Local) Publish: Full Release"
run-name: "(Local) Publish: Full Release — ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1
  cancel-in-progress: false
jobs:
  release:
    name: Validate And Publish
    if: github.repository == 'FedRAMP/shared-workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout Repository Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run Quick Checks
        uses: ./release-management/quick-check
      - name: Test And Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 release-management/release.py
      - name: Clean Test Resources
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-management/release.py cleanup
      - name: Save Release Evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: ignore
          retention-days: 30
