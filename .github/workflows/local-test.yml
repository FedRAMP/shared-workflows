name: "(Local) Test: All Builds & Pull Requests"
run-name: "(Local) Test: All Builds & Pull Requests — ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1
  cancel-in-progress: false
jobs:
  test:
    name: Full Integration Tests
    if: github.repository == 'FedRAMP/shared-workflows' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/local-release-e2e.yml
