name: "(Local) Test: Quick CI Checks"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository Sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Quick Checks
        uses: ./release-management/quick-check
