name: "(Shared) Import: Build Sites And Prepare Draft PR"

on:
  workflow_call:
    outputs:
      changed:
        description: Whether source changes required builds
        value: ${{ jobs.discover.outputs.changed }}
    inputs:
      sites:
        description: JSON array of site IDs, repositories, destinations, and builder options
        type: string
        required: true
      base-branch:
        type: string
        default: develop
      import-branch:
        type: string
        default: automation/zensical-sites
      create-pr:
        type: boolean
        default: false
      artifact-prefix:
        description: Optional prefix to isolate artifacts when called multiple times in one run
        type: string
        default: ""
      release-test:
        description: Restricted to this repository's isolated release test branches
        type: boolean
        default: false
    secrets:
      ZENSICAL_IMPORT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Find Source Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.discover.outputs.changed }}
      matrix: ${{ steps.discover.outputs.matrix }}
      base-sha: ${{ steps.discover.outputs.base-sha }}
      paths: ${{ steps.discover.outputs.paths }}
    steps:
      - name: Checkout Destination Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-branch }}
          persist-credentials: false
      - name: Checkout Shared Tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false
      - name: Find Source Changes
        id: discover
        env:
          SITES: ${{ inputs.sites }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          IMPORT_BRANCH: ${{ inputs.import-branch }}
          CREATE_PR: ${{ inputs.create-pr }}
          RELEASE_TEST: ${{ inputs.release-test }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: python3 .shared-workflows/import-zensical-sites/zensical-import.py discover

  build:
    name: Build ${{ matrix.id }} Site
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-zensical-artifact.yml
    with:
      source-repository: ${{ matrix.repository }}
      source-ref: ${{ matrix.sha }}
      preview-urls: false
      artifact-mode: archive
      artifact-name: ${{ inputs.artifact-prefix }}import-${{ matrix.id }}
      use-bun: ${{ matrix.use-bun }}
      submodules: ${{ matrix.submodules }}
      venv-path: ${{ matrix.venv-path }}
      build-script: ${{ matrix.build-script }}

  collect:
    name: Collect Built Sites
    needs: [discover, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout Destination Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.discover.outputs.base-sha }}
          persist-credentials: false
      - name: Checkout Shared Tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false
      - name: Download Site Archives
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ inputs.artifact-prefix }}import-*
          path: ${{ runner.temp }}/site-artifacts
      - name: Verify Site Archives
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
          GIT_TERMINAL_PROMPT: '0'
        run: python3 .shared-workflows/import-zensical-sites/zensical-import.py collect
      - name: Upload Site Archives
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-prefix }}collected-sites
          path: |
            ${{ runner.temp }}/collected-sites.tar.gz
            ${{ runner.temp }}/import-pr.md
          if-no-files-found: error
          retention-days: 7

  import-pr:
    name: Prepare Import PR
    needs: [discover, collect]
    # discover enforces the production or isolated release-test repository/branch scope.
    if: inputs.create-pr
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Destination Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-branch }}
          persist-credentials: false
      - name: Verify Base Commit
        env:
          EXPECTED_BASE: ${{ needs.discover.outputs.base-sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_BASE" ]]; then
            echo '::error::Base branch changed during the import. Rerun against its latest commit.'
            exit 1
          fi
      - name: Checkout Shared Tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false
      - name: Download Site Archives
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix }}collected-sites
          path: ${{ runner.temp }}/collected
      - name: Apply Built Sites
        env:
          ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
        run: python3 .shared-workflows/import-zensical-sites/zensical-import.py apply
      - name: Update Draft PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.ZENSICAL_IMPORT_TOKEN || github.token }}
          base: ${{ inputs.base-branch }}
          branch: ${{ inputs.import-branch }}
          draft: always-true
          add-paths: ${{ needs.discover.outputs.paths }}
          commit-message: Import updated Zensical sites
          title: Import updated Zensical sites
          body-path: ${{ runner.temp }}/collected/import-pr.md
      - name: Report Import PR
        if: steps.pr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: echo "Import PR ($PR_OPERATION) -- $PR_URL" >> "$GITHUB_STEP_SUMMARY"
