name: Builds & deploys Zensical sites for GitHub pages (FedRAMP style)

on:
  workflow_call:
    inputs:
      source-repository:
        type: string
        default: ""
      source-ref:
        type: string
        default: ""
      preview-urls:
        type: boolean
        default: true
      artifact-mode:
        type: string
        default: pages
      artifact-name:
        type: string
        default: site-archive
      deploy:
        description: Deploy the built site to GitHub Pages
        type: boolean
        default: true
      build-script:
        description: Optional repository-local script that builds html/
        type: string
        default: ""
      use-bun:
        type: boolean
        default: false
      submodules:
        type: boolean
        default: false
      venv-path:
        type: string
        default: ".venv"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.deploy && 'pages' || format('site-check-{0}-{1}', github.ref, inputs.artifact-name) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate build and deployment settings
        env:
          MODE: ${{ inputs.artifact-mode }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          case "$MODE" in pages|archive) ;; *) echo "::error::Invalid artifact-mode"; exit 1 ;; esac
          if [[ "$MODE" == archive && "$DEPLOY" == true ]]; then
            echo '::error::Archive mode cannot deploy to Pages'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source-repository || github.repository }}
          ref: ${{ inputs.source-ref }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-workflows
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install shared Python dependencies
        env:
          VENV_PATH: ${{ inputs.venv-path }}
        run: |
          python -m venv "$VENV_PATH"
          "$VENV_PATH/bin/python" -m pip install \
            --require-hashes -r .shared-workflows/requirements.txt
          echo "$GITHUB_WORKSPACE/$VENV_PATH/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2
        if: inputs.use-bun
        with:
          bun-version: "1.4.4"

      - name: Set preview site URL
        if: inputs.preview-urls
        run: |
          sed -i '/^[[:space:]]*site_url[[:space:]]*=/s|www\.fedramp\.gov|preview.fedramp.gov|g' zensical.toml

      - name: Build site
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: |
          if [[ -n "$BUILD_SCRIPT" ]]; then
            bash "$BUILD_SCRIPT"
          else
            zensical build --clean --strict
          fi

      - name: Verify generated output
        run: test -s html/index.html

      - name: Package import archive
        if: inputs.artifact-mode == 'archive'
        env:
          USE_BUN: ${{ inputs.use-bun }}
        run: |
          mkdir -p "$RUNNER_TEMP/site-artifact"
          tar -czf "$RUNNER_TEMP/site-artifact/site.tar.gz" -C html .
          {
            python --version
            python -m pip show zensical | sed -n 's/^Version: /Zensical /p'
            if [[ "$USE_BUN" == true ]]; then printf 'Bun '; bun --version; fi
          } > "$RUNNER_TEMP/site-artifact/build-info.txt"

      - uses: actions/upload-artifact@v4
        if: inputs.artifact-mode == 'archive'
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/site-artifact/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        if: inputs.artifact-mode == 'pages'
        with:
          path: html/

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
