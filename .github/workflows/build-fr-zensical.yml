name: "(Shared) Publish: Build Site And Deploy Pages"

on:
  workflow_call:
    inputs:
      source-repository:
        type: string
        default: ""
      source-ref:
        type: string
        default: ""
      preview-urls:
        type: boolean
        default: true
      artifact-mode:
        type: string
        default: pages
      artifact-name:
        type: string
        default: site-archive
      deploy:
        description: Deploy the built site to GitHub Pages
        type: boolean
        default: true
      build-script:
        description: Optional repository-local script that builds html/
        type: string
        default: ""
      use-bun:
        type: boolean
        default: false
      submodules:
        type: boolean
        default: false
      venv-path:
        type: string
        default: ".venv"

permissions:
  contents: read

concurrency:
  group: ${{ inputs.deploy && 'pages' || format('site-check-{0}-{1}', github.ref, inputs.artifact-name) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment Settings
    runs-on: ubuntu-26.04
    steps:
      - name: Validate Deployment Settings
        env:
          MODE: ${{ inputs.artifact-mode }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          if [[ "$MODE" == archive && "$DEPLOY" == true ]]; then
            echo '::error::Archive mode cannot deploy to Pages'
            exit 1
          fi

  build:
    name: Build Site Artifact
    needs: validate
    uses: ./.github/workflows/build-zensical-artifact.yml
    with:
      source-repository: ${{ inputs.source-repository }}
      source-ref: ${{ inputs.source-ref }}
      preview-urls: ${{ inputs.preview-urls }}
      artifact-mode: ${{ inputs.artifact-mode }}
      artifact-name: ${{ inputs.artifact-name }}
      build-script: ${{ inputs.build-script }}
      use-bun: ${{ inputs.use-bun }}
      submodules: ${{ inputs.submodules }}
      venv-path: ${{ inputs.venv-path }}

  deploy:
    name: Deploy GitHub Pages
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact-name == 'site-archive' && 'github-pages' || inputs.artifact-name }}
