# Deploys Zensical site to GitHub Pages using the FedRAMP shared workflow

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: FedRAMP/shared-workflows/.github/workflows/build-fr-zensical.yml@v1
    with:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
# Additional stuff for 2026 or similar, edit as appropriate.
